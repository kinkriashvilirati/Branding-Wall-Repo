<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Animation Stage</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mouseGuides.css" />
    <link rel="stylesheet" href="./gameStyle.css" />
  </head>
  <body>
    <main class="workspace">
      <div class="stage-toolbar">
        <button id="toggle-guides" type="button" aria-pressed="true">
          Hide guides (G)
        </button>
        <output id="coordinates">x: 0, y: 0</output>
      </div>

      <!-- Position every animated image inside this container. -->
      <div class="container show-guides" id="stage">
        <img
          class="stage-background"
          src="./assets/backgrounds/bg.svg"
          alt=""
          draggable="false"
        />

        <!-- Example layer. Duplicate this and change src/top/left/width. -->
        <img
          class="layer board"
          src="./assets/board/board.png"
          alt="Game board"
          draggable="false"
        />

        <div class="card-intro" id="card-intro">
          <div class="intro-card intro-card-left">
            <div class="intro-card-inner">
              <img class="intro-card-face intro-card-front" src="./assets/cards/Hearts/4.png" alt="Four of hearts" draggable="false" />
              <img class="intro-card-face intro-card-back" src="./assets/cards/backofthecard/back.png" alt="" draggable="false" />
            </div>
          </div>
          <div class="intro-card intro-card-center">
            <div class="intro-card-inner">
              <img class="intro-card-face intro-card-front" src="./assets/cards/Diamonds/J.png" alt="Jack of diamonds" draggable="false" />
              <img class="intro-card-face intro-card-back" src="./assets/cards/backofthecard/back.png" alt="" draggable="false" />
            </div>
          </div>
          <div class="intro-card intro-card-right">
            <div class="intro-card-inner">
              <img class="intro-card-face intro-card-front" src="./assets/cards/Spades/A.png" alt="Ace of spades" draggable="false" />
              <img class="intro-card-face intro-card-back" src="./assets/cards/backofthecard/back.png" alt="" draggable="false" />
            </div>
          </div>
          <img class="intro-hand" src="./assets/hand/hand.png" alt="" draggable="false" />
        </div>

        <div class="stage-grid" aria-hidden="true"></div>
        <div class="guide guide-x" aria-hidden="true"></div>
        <div class="guide guide-y" aria-hidden="true"></div>
      </div>
    </main>
    <script src="./script.js"></script>
    <script src="./mouseGuides.js"></script>
  </body>
</html>
